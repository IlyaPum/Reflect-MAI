org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
android.overridePathCheck=true
# Обходной путь: плагин tflite_flutter объявляет несовпадающие JVM-цели
# Java/Kotlin — понижаем ошибку Kotlin до предупреждения (D8/R8 в текущем AGP
# корректно дексит смешанный байткод).
kotlin.jvm.target.validation.mode=warning
# Обходной путь: модули tensorflow-lite (/-api/-gpu) объявляют один общий
# namespace org.tensorflow.lite — это ожидаемо и безвредно, но новая проверка
# AGP 8.9+ запрещает. Отключаем проверку глобально (единственный способ,
# нет DSL-опции: github.com/stripe/stripe-android/issues/15259).
android.uniquePackageNames=false
